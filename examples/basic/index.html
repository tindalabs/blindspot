<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blindspot — Example App</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; }
      header { background: #161b27; border-bottom: 1px solid #1e2d40; color: #f8fafc; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
      header h1 { font-size: 1.1rem; letter-spacing: 0.05em; }
      nav a { color: #94a3b8; text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 4px; transition: background 0.15s; }
      nav a:hover, nav a.active { background: rgba(255,255,255,0.08); color: #f8fafc; }
      main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
      .card { background: #161b27; border: 1px solid #1e2d40; border-radius: 10px; padding: 1.5rem; margin-bottom: 1rem; }
      button { padding: 0.5rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: opacity 0.15s; }
      .btn-primary { background: #6366f1; color: #fff; }
      .btn-primary:hover { background: #4f46e5; }
      .btn-secondary { background: #1e2533; color: #94a3b8; border: 1px solid #2d3748; }
      .btn-secondary:hover { background: #263044; }
      input[type=text], textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #2d3748; border-radius: 6px; font-size: 0.9rem; margin-bottom: 0.75rem; background: #1a2235; color: #e2e8f0; }
      .task-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #1e2d40; }
      .task-item:last-child { border-bottom: none; }
      .badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 12px; background: #1e2533; color: #94a3b8; }
      .badge.ok { background: #14532d; color: #4ade80; }
      .badge.err { background: #2c1010; color: #f87171; }
      #status { margin-top: 0.75rem; font-size: 0.85rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <header>
      <h1>Blindspot</h1>
      <nav>
        <a href="/" data-blindspot-label="nav-home">Home</a>
        <a href="/tasks" data-blindspot-label="nav-tasks">Tasks</a>
        <a href="/about" data-blindspot-label="nav-about">About</a>
      </nav>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
