name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      # Lints what npm will actually publish: export conditions and the types
      # each module resolution mode sees. Types misresolve silently in consumers.
      - name: Check package exports
        run: pnpm lint:package

      # Coverage is not gated by a threshold; running it is what matters. The
      # coverage provider must match the vitest version exactly, and a mismatch
      # only fails a coverage run (Dependabot PR #50 passed plain tests).
      - name: Test
        run: pnpm test:coverage

      - name: Audit
        run: pnpm audit --audit-level=high
