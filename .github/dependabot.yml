# Dependabot — keeps the toolchain fresh without flooding the queue.
# Monthly cadence suits a project at this maturity; non-major bumps are grouped
# into a single PR per cycle, while majors come through individually so they get
# a proper review, except for the lockstep families grouped below.
# `directory: /` covers the whole pnpm workspace via the root lockfile.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Dependabot puts a dependency in the first group that matches, so the
    # lockstep families come first. Each family releases in lockstep with
    # exact-version peers; a major taken one package at a time breaks it
    # (PR #50 bumped vitest without @vitest/coverage-v8, which broke coverage).
    # These groups cover every update type, majors included.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"
      # react and react-dom must be the same version: Next refuses to build with
      # a mismatch (PR #61 bumped react-dom to 19 alone). Their types follow them.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # One PR per cycle for all other minor/patch bumps across the workspace.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types must match the Node runtime pinned in .nvmrc; a newer major
      # would type-check APIs our runtime lacks. Bump it with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The OTLP exporter 0.300+ is built on OTel JS SDK 3 and needs api 1.10+,
      # while sdk-trace-web is still on SDK 2 (which needs api < 1.10). Mixing
      # the lines breaks peers and bundles two SDKs. Lift these with the SDK 3
      # migration (see LEDGER.md).
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      # The stable SDK packages move to 3.x as one line. Taking any of them alone
      # pairs SDK 3 internals with the SDK 2 sdk-trace-web (Dependabot PR #49).
      - dependency-name: "@opentelemetry/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/resources"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/sdk-trace-web"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  # Keeps GitHub Actions pinned versions current (e.g. checkout/setup-node),
  # which also clears the Node-20-runtime deprecation warnings over time.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # v2 requires the Changesets CLI v3 and renames our inputs; release.yml
      # only runs on push to main, so PR CI cannot catch a broken bump. Migrate
      # both together deliberately (see LEDGER.md).
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
      # `@v4` already floats to every 4.x release; minor/patch PRs would only
      # pin it to a tag, freezing updates without the benefit of a SHA pin.
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
