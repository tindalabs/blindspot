# Dependabot — keeps the toolchain fresh without flooding the queue.
# Monthly cadence suits a project at this maturity; non-major bumps are grouped
# into a single PR per cycle, while majors come through individually so they get
# a proper review. `directory: /` covers the whole pnpm workspace via the root
# lockfile. https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # One PR per cycle for all minor/patch bumps across the workspace.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types must match the Node runtime pinned in .nvmrc; a newer major
      # would type-check APIs our runtime lacks. Bump it with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  # Keeps GitHub Actions pinned versions current (e.g. checkout/setup-node),
  # which also clears the Node-20-runtime deprecation warnings over time.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # v2 requires the Changesets CLI v3 and renames our inputs; release.yml
      # only runs on push to main, so PR CI cannot catch a broken bump. Migrate
      # both together deliberately (see LEDGER.md).
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
      # `@v4` already floats to every 4.x release; minor/patch PRs would only
      # pin it to a tag, freezing updates without the benefit of a SHA pin.
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
